services:
  postgres:
    image: postgres:16-alpine
    container_name: sassoir-postgres
    environment:
      POSTGRES_DB: sassoir
      POSTGRES_USER: sassoir
      POSTGRES_PASSWORD: sassoir_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sassoir -d sassoir"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:


